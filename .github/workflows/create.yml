name: Create Map
on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:
jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Create map
        run: uv run --frozen main.py
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          TOM_TOM_TOKEN: ${{ secrets.TOM_TOM_TOKEN }}
          GH_USER: elgohr
      - name: Commit new map
        run: |
          git config --global user.name 'Globe Bot'
          git config --global user.email 'noreply@gohr.digital'
          git add .
          git commit -m ":arrow_up: Updated Map"
          git pull -r
          git push
